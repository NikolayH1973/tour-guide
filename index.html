<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карманный гид</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#142033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гид">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-column phone app, content cards on a cool London-fog ground,
   bottom tab bar; pillar-box red for actions, Christmas-light gold for "now". */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #5b6678;
  --line: #d9dee6;
  --accent: #c8102e;      /* pillar-box red */
  --accent-ink: #ffffff;
  --gold: #b8860b;        /* Christmas lights */
  --gold-soft: #fbf3dc;
  --tube: #003688;        /* Piccadilly line blue */
  --l-piccadilly: var(--tube); --l-district: #00782A; --l-hc: #c2577a;
  --tube-ink: #ffffff;    /* текст на синем фоне */
  --optional: #6b4fa0;
  --optional-soft: #efe9f8;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Golos Text", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1522; --surface: #172235; --ink: #eef2f8; --muted: #a3afc2; --line: #2a3850;
    --accent: #ff4d5e; --accent-ink: #1a0508; --gold: #f2c45a; --gold-soft: #2b2614;
    --tube: #6f95ff; --tube-ink: #0d1522; --optional: #c3a8ff; --optional-soft: #2a2340;
    --l-district: #4cc37a; --l-hc: #f3a9bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1522; --surface: #172235; --ink: #eef2f8; --muted: #a3afc2; --line: #2a3850;
  --accent: #ff4d5e; --accent-ink: #1a0508; --gold: #f2c45a; --gold-soft: #2b2614;
  --tube: #6f95ff; --tube-ink: #0d1522; --optional: #c3a8ff; --optional-soft: #2a2340;
  --l-district: #4cc37a; --l-hc: #f3a9bb;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.125rem; /* 18px при обычном размере; растёт вместе с «А+» */ line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.15; }
h2 { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; overflow-x: clip; /* страховка: ничто не делает страницу шире экрана */
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px); }

header.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
/* Размер шрифта: всё в приложении задано в rem, поэтому достаточно поменять корневой размер */
html[data-fs="1"] { font-size: 115%; }
html[data-fs="2"] { font-size: 130%; }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.fs-btn { flex: none; min-width: 52px; min-height: 44px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.fs-btn .a { font-family: var(--font-display); font-size: 1.15rem; }
.fs-btn .dots { display: flex; gap: 3px; }
.fs-btn .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.fs-btn .dots i.on { background: var(--accent); }
.clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.clock { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
.clock .lbl { font-size: .8rem; color: var(--muted); }
.clock .t { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.clock .date { font-size: .85rem; font-weight: 600; }
.clock .note { font-size: .78rem; color: var(--muted); }
.clock .note.night { color: var(--optional); font-weight: 600; }
.eyebrow { font-size: .85rem; color: var(--muted); font-weight: 500; letter-spacing: .02em; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card.now { border: 2px solid var(--gold); background: linear-gradient(var(--gold-soft), var(--surface) 70%); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; width: fit-content; }
.pill.gold { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
.pill.opt { background: var(--optional-soft); color: var(--optional); }
.pill.todo { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }

.meet { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.meet .time { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.meet .place { font-weight: 500; }

ul.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.items li { display: flex; gap: 10px; align-items: flex-start; }
ul.items li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .6em; border-radius: 50%; background: var(--accent); }
ul.items li.opt::before { background: var(--optional); }
ul.items li.plain::before { visibility: hidden; }
ul.items li > a.it-row, ul.items li > details.it-info { flex: 1; min-width: 0; }
a.it-row { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; color: inherit; text-decoration: none; }
a.it-row .chev, .it-i { flex: none; color: var(--accent); font-weight: 700; }
a.it-row .pill.opt { white-space: normal; }
details.it-info > summary { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; cursor: pointer; list-style: none; }
details.it-info > summary::-webkit-details-marker { display: none; }
details.it-info[open] > summary .it-i { opacity: .55; }
details.it-info > p { margin: 6px 0 0; font-size: .92em; color: var(--muted); }
details.it-info .btn-row { margin-top: 8px; }
/* Викторина и тренажёр фраз */
.quiz-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.quiz-bar i { display: block; height: 100%; background: var(--gold); }
.quiz-opts { display: grid; gap: 10px; }
.quiz-opt { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.quiz-opt b { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-size: .9rem; }
.quiz-opt span { display: flex; flex-direction: column; }
.quiz-opt em { font-style: normal; font-size: .85rem; font-weight: 600; }
.quiz-opt.ok { border-color: #1e8e4e; background: #e6f5ec; }
.quiz-opt.ok b { background: #1e8e4e; color: #fff; } .quiz-opt.ok em { color: #1e7a45; }
.quiz-opt.bad { border-color: var(--accent); background: #fdeaec; }
.quiz-opt.bad b { background: var(--accent); color: #fff; } .quiz-opt.bad em { color: var(--accent); }
.quiz-opt.dim { opacity: .55; }
.quiz-opt:disabled { cursor: default; }
:root[data-theme="dark"] .quiz-opt.ok { background: #183526; } :root[data-theme="dark"] .quiz-opt.ok em { color: #7fd6a2; }
:root[data-theme="dark"] .quiz-opt.bad { background: #3a1820; } :root[data-theme="dark"] .quiz-opt.bad em { color: #ff9aa6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .quiz-opt.ok { background: #183526; } :root:not([data-theme="light"]) .quiz-opt.ok em { color: #7fd6a2; }
  :root:not([data-theme="light"]) .quiz-opt.bad { background: #3a1820; } :root:not([data-theme="light"]) .quiz-opt.bad em { color: #ff9aa6; }
}
.quiz-quit { align-self: center; min-height: 44px; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }
.quiz-result { align-items: center; text-align: center; }
.quiz-score { font-size: 2.6rem; font-weight: 800; line-height: 1.1; }
.quiz-themes { display: grid; gap: 8px; }
.quiz-theme { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.quiz-theme > span:first-child { flex: 1; }
.quiz-theme[aria-checked="true"] { border-color: var(--ink); font-weight: 700; }
.quiz-theme[aria-checked="true"]::after { content: "✓"; margin-left: 8px; }
.quiz-ranks > div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.quiz-ranks > div:last-child { border-bottom: 0; }
.quiz-miss { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.quiz-miss:last-child { border-bottom: 0; }
.quiz-place, .play-row { text-decoration: none; color: inherit; }
.quiz-place { font-size: .95rem; font-weight: 600; color: var(--accent); }
.flash { align-items: center; justify-content: center; text-align: center; min-height: 230px; font: inherit; color: var(--ink); cursor: pointer; width: 100%; }
.flash.flipped { border: 2px solid var(--gold); }
.flash-ru { font-size: 1.35rem; font-weight: 700; }
.flash-en { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
.card-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tip { font-size: .95rem; padding: 10px 12px; border-left: 4px solid var(--gold); background: var(--gold-soft); border-radius: 0 10px 10px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; cursor: pointer; text-align: center; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.maplink { align-self: center; font-size: .95rem; font-weight: 500; padding: 8px 12px; min-height: 44px; display: inline-flex; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.rail { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chips.rail .chip { flex: none; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .95rem; }
a.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .9rem; margin-bottom: 14px; }
.preview-bar button { background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 6px 12px; cursor: pointer; color: inherit; }

.day-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.nav-btn { min-height: 44px; min-width: 44px; padding: 6px 10px; font-size: 1.1rem !important; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.nav-btn:disabled { opacity: .35; cursor: default; }
/* Номера дней: если не помещаются (тур на 17 дней) — листаются пальцем внутри полосы.
   auto-отступы у крайних кнопок центрируют короткий ряд, а длинный начинают с края, не обрезая «1». */
.day-dots { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0; scroll-behavior: smooth; }
.day-dots::-webkit-scrollbar { display: none; }
.day-dots > :first-child { margin-left: auto; }
.day-dots > :last-child { margin-right: auto; }
.dot-btn { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.dot-btn[aria-current="true"] { background: var(--gold); border-color: var(--gold); color: #fff; }
.next-card { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.offline-bar { margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; background: var(--gold-soft); border: 1px solid var(--gold); font-size: .9rem; }
.offline-bar[hidden] { display: none; }
details.card summary { cursor: pointer; min-height: 32px; }
details.card[open] summary { margin-bottom: 6px; }
.install-steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.phrase .en { font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.phrase .tr { color: var(--tube); font-size: 1rem; }
.phrase .ru { color: var(--muted); }
.speak-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.speak-row .btn { min-height: 48px; padding: 8px 6px; font-size: .9rem; }
.btn[aria-pressed="true"] { outline: 3px solid var(--gold); }
.basics { display: flex; flex-direction: column; gap: 8px; }
.basics div { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; }
.basics b { white-space: nowrap; }
.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; }
.big-num { font-family: var(--font-display); font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Program */
.day { position: relative; }
.day .date { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day .date b { font-variant-numeric: tabular-nums; }
.day.today { border: 2px solid var(--gold); }

/* Help */
.address { font-size: 1.15rem; font-weight: 600; line-height: 1.4; }
.roundel { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.roundel i { width: 30px; height: 30px; border-radius: 50%; border: 6px solid var(--accent); position: relative; flex: none; }
.roundel i::after { content: ""; position: absolute; left: -10px; right: -10px; top: 50%; height: 7px; transform: translateY(-50%); background: var(--tube); }
.contact { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.contact:first-of-type { border-top: 0; }
.contact .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.contact a.call { flex: none; min-width: 52px; min-height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; }
.contact a.call.wa { background: #1f9d55; color: #fff; }
.contact .call.off { background: var(--line); color: var(--muted); }

.taxi { position: fixed; inset: 0; background: #ffffff; color: #000000; z-index: 50; display: none; flex-direction: column; justify-content: center; gap: 20px;
  padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px); }
.taxi.open { display: flex; }
.taxi .t1 { font-size: 1.4rem; }
.taxi .t2 { font-size: 2.3rem; font-weight: 700; line-height: 1.15; }
.taxi .t3 { font-size: 1.6rem; line-height: 1.3; }
.taxi button { align-self: flex-start; min-height: 52px; padding: 10px 20px; border-radius: 12px; border: 2px solid #000; background: #fff; color: #000; font-weight: 600; cursor: pointer; }

/* Tools */
/* minmax(0,1fr) + min-width:0 — иначе поле ввода (у него «природная» ширина ~20 символов) распирает страницу шире экрана */
.conv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.field { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .9rem; color: var(--muted); }
.field .inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 14px; }
.field .inp span { font-size: 1.3rem; font-weight: 600; color: var(--muted); width: 1.4em; }
.field input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1.5rem; font-weight: 600; padding: 12px 0; font-variant-numeric: tabular-nums; }
.field input:focus { outline: none; }
.field .inp:focus-within { outline: 3px solid var(--gold); }
.rate-row { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); flex-wrap: wrap; }
.rate-row input { width: 80px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.quick div { background: var(--bg); border-radius: 8px; padding: 6px; text-align: center; }

.check { display: flex; gap: 12px; align-items: center; min-height: 48px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.check input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.tips { display: grid; grid-template-columns: 1fr; gap: 12px; }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
/* minmax(0,1fr): колонки всегда равные, даже при крупном шрифте (иначе длинное слово распирает колонку) */
/* Плавающая кнопка «Назад»: появляется, когда ссылка унесла вниз по тому же экрану (к опции) — в установленном
   приложении на iPhone нет кнопки «назад» браузера, а свайп легко не заметить */
.backfab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 41;
  border: 0; border-radius: 999px; padding: 12px 20px; min-height: 48px; font: inherit; font-weight: 700; font-size: 1rem;
  background: var(--ink); color: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; white-space: nowrap; }
.backfab[hidden] { display: none; }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 90vw; }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs a { position: relative; z-index: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 2px 10px; text-decoration: none; color: var(--muted); font-size: 11.5px; /* подписи меню не растут с «А+»: рядом иконки, а крупный текст переносится по слогам */ font-weight: 500; text-align: center; line-height: 1.15; overflow-wrap: anywhere; hyphens: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
nav.tabs a span { max-width: 100%; }

/* Пешие прогулки: «ниточка» от станции до станции */
ol.walk { list-style: none; margin: 0; padding: 0; position: relative; }
ol.walk::before { content: ""; position: absolute; left: 13px; top: 16px; bottom: 16px; border-left: 4px dotted var(--muted); }
ol.walk > li { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
ol.walk .dot { width: 30px; height: 30px; display: grid; place-items: center; z-index: 1; }
ol.walk .dot i { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 4px solid var(--accent); }
ol.walk > li.w-st .dot i { width: 22px; height: 22px; border: 5px solid var(--tube); }
ol.walk > li.w-st, ol.walk > li.w-pt { padding: 6px 0; }
ol.walk > li.w-pt a.it-row { min-height: 44px; }
ol.walk > li.w-leg { font-size: .85rem; color: var(--muted); padding: 2px 0; }
.w-food { font-size: .78rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
.note-warn { background: #fbf3dc; color: #5a4300; border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
:root[data-theme="dark"] .note-warn { background: #3a3220; color: #f3dfa6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note-warn { background: #3a3220; color: #f3dfa6; } }
/* Places: line diagram */
.line { list-style: none; margin: 0; padding: 0; position: relative; }
.line::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 8px; border-radius: 4px; background: var(--tube); }
.line > li { position: relative; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 7px 0; }
.line > li > .dot { width: 30px; height: 30px; display: grid; place-items: center; z-index: 1; }
.line .dot i { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 4px solid var(--tube); }
.line > li.home .dot i { width: 28px; height: 28px; border: 6px solid var(--accent); }
.line .st { font-weight: 600; line-height: 1.25; }
.line > li.home .st { color: var(--accent); }
.line .near { font-size: .88rem; color: var(--muted); line-height: 1.35; }
.line .stops { font-size: .8rem; font-weight: 600; color: var(--tube); white-space: nowrap; padding-top: 3px; font-variant-numeric: tabular-nums; }
.route { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.r-st { display: flex; align-items: center; gap: 10px; font-size: .92rem; }
.r-st i { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }
.r-leg { display: flex; align-items: center; gap: 8px; margin-left: 5px; padding: 6px 0 6px 13px; border-left: 4px solid var(--lc); }
:root[data-theme="dark"] .r-leg[style*="#000000"] { border-left-color: #8a96a8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .r-leg[style*="#000000"] { border-left-color: #8a96a8; } }
.r-line { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.r-chg { font-size: .72rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 7px; }
.r-walk { margin-left: 5px; padding: 4px 0 4px 13px; border-left: 4px dotted var(--muted); font-size: .88rem; color: var(--muted); }
.st-more { margin-top: 4px; }
.st-more summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--tube); min-height: 32px; display: flex; align-items: center; }
.st-list { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.st-list a { color: var(--ink); }
.near-btn { width: 100%; }
.wx { font-size: .95rem; }
.alt-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 14px; }
.alt-links .maplink { color: var(--muted); font-size: .88rem; min-height: 36px; }
.app-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.app-row:first-of-type { border-top: 0; }
.ticket-btn { width: 100%; background: transparent; color: var(--tube); border: 1px solid var(--tube); }
.hint { font-size: .85rem; color: var(--muted); line-height: 1.4; }
details.guide summary { cursor: pointer; min-height: 36px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
details.guide[open] summary { margin-bottom: 8px; }
.near-help summary { cursor: pointer; font-size: .9rem; font-weight: 600; color: var(--tube); min-height: 36px; display: flex; align-items: center; }
.near-help[open] summary { margin-bottom: 6px; }
.near-panel { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }

.near-dist { font-weight: 700; color: var(--tube); }
.photo-tip { font-size: .95rem; padding: 10px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--tube); }
.place-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .88rem; color: var(--muted); }

/* ===== Новый экран «Места»: плитки, полки, строки ===== */
/* Две равные плитки-инструмента наверху. Без красного: красный = «выбрано» и «вы здесь» */
.tools2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tool { display: flex; gap: 10px; align-items: flex-start; padding: 12px; min-height: 64px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--ink); text-decoration: none; }
.tool svg { flex: none; width: 24px; height: 24px; color: var(--tube); margin-top: 1px; }
.tool b { display: block; font-size: 1rem; line-height: 1.25; }
.tool small { display: block; font-size: .78rem; color: var(--muted); margin-top: 3px; line-height: 1.3; }
/* Полка: заголовок + ряд плиток с прокруткой вбок */
.shelf-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.shelf-h h2 { font-size: 1.12rem; margin: 0; }
.tile .t-day { color: var(--accent); font-weight: 600; }
.tile .t-day.done { color: #1e8a4c; }
:root[data-theme="dark"] .tile .t-day.done { color: #7fd6a2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .t-day.done { color: #7fd6a2; } }
.shelf-h a { flex: none; font-size: .9rem; font-weight: 600; color: var(--tube); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
/* margin -16px + padding 16px: ряд доходит до краёв экрана, а первая плитка стоит ровно по сетке */
.rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 4px -16px 0; padding: 2px 16px 6px;
  scroll-padding-left: 16px; scrollbar-width: none; overscroll-behavior-x: contain; }
.rail::-webkit-scrollbar { display: none; }
/* 42% ширины: видно две плитки и краешек третьей — это подсказка «листай вбок» */
.tile { flex: 0 0 42%; max-width: 190px; scroll-snap-align: start; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px;
  padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); text-decoration: none; }
.tile b { font-size: .95rem; line-height: 1.3; margin-top: 6px; }
.tile small { font-size: .78rem; color: var(--muted); line-height: 1.3; }
/* Иконка категории — квадрат с цветами той же категории, что у плашек .pill.cat-… */

/* Строка списка: иконка · название и подпись · стрелка */
.plist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.prow { display: flex; gap: 12px; align-items: center; padding: 10px 12px; min-height: 60px; color: var(--ink); text-decoration: none; }
.prow + .prow { border-top: 1px solid var(--line); }
.prow-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prow-t b { font-size: 1rem; line-height: 1.3; }
.prow-t small { font-size: .82rem; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.prow .chev, .tile .chev { color: var(--muted); font-size: 1.3rem; }
.t-near { color: var(--tube); font-weight: 600; }
.t-closed { color: var(--accent); font-weight: 600; }
/* Заголовок под-экрана: стрелка «назад» + название */
.sub-h { display: flex; align-items: center; gap: 6px; }
.sub-h h2 { margin: 0; font-size: 1.25rem; line-height: 1.25; flex: 1; min-width: 0; }
.back { flex: none; width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: 12px; }
.back svg { width: 24px; height: 24px; }
.cats-more { border-top: 1px dashed var(--line); padding-top: 8px; }
/* Главная кнопка карточки места — цвета линии Piccadilly */
.btn.go-btn { background: var(--tube); color: var(--tube-ink); }
#options { scroll-margin-top: 16px; }
.opt-card > .btn, #options > .btn { width: 100%; box-sizing: border-box; }

.opt-card summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.opt-card summary::-webkit-details-marker { display: none; }
.opt-card summary .opt-t::after { content: "\00a0▾"; color: var(--muted); font-weight: 400; }
.opt-card[open] summary .opt-t::after { content: "\00a0▴"; }
.opt-card[open] > :not(summary) { margin-top: 10px; }
a.pill.opt { text-decoration: none; white-space: nowrap; }
.nodraft { background: #fff1dc; color: #7a4300; padding: 10px 14px; font-size: .85rem; line-height: 1.35; }
/* Машина времени (только ?draft / ?demo) */
.tm-bar { position: sticky; top: 0; z-index: 50; display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 8px 12px; background: #1d2433; color: #fff; font-size: .82rem; scrollbar-width: none; }
.tm-bar::-webkit-scrollbar { display: none; }
.tm-t { font-weight: 700; white-space: nowrap; margin-right: 4px; }
.tm-bar button, .tm-bar select { flex: none; font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.tm-bar select option { color: #000; }
.tm-bar [aria-pressed="true"] { background: #fff; color: #1d2433; font-weight: 700; }

details.flroute > summary::-webkit-details-marker { display: none; }
.rt-h { font-weight: 700; font-size: 1.05rem; }

.rt-chip { display: inline-block; align-self: flex-start; font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.rt-chip.ok { background: #e8f3ec; color: #1e6b40; } .rt-chip.late { background: #fff1dc; color: #a35a00; } .rt-chip.bad { background: #fde4e4; color: #a11; }
.rt-line { list-style: none; margin: 12px 0 0; padding: 0 0 0 18px; position: relative; }
.rt-line::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }

.rt-time { font-size: 1.3rem; font-weight: 700; min-width: 58px; font-variant-numeric: tabular-nums; }
.rt-city { display: flex; flex-direction: column; }
.rt-seg { padding: 2px 0 6px 70px; }
.rt-seg .flight-rows { margin-top: 6px; }
.rt-lay { margin: 6px 0 6px 0; padding: 6px 10px; border-radius: 10px; background: var(--bg); font-size: .85rem; color: var(--muted); }

.rt-final { font-weight: 700; margin: 10px 0 0; }
.flight-st { font-size: 1.2rem; font-weight: 700; margin: 0; }
.flight-rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.steps .n { flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem;
  background: var(--bg); color: var(--tube); border: 1px solid var(--line); }

<script>
/* МАШИНА ВРЕМЕНИ — только в предпросмотре (?draft) и на показе агентству (?demo); туристы её не видят.
   Приложение везде берёт «сейчас» из Date. Подменяем Date до запуска движка: к настоящему времени
   прибавляем сдвиг, и часы, обратный отсчёт, «сегодня», рейсы ведут себя как в выбранный момент.
   Сдвиг живёт в sessionStorage — закрыл вкладку, и всё вернулось к настоящему времени. */
const RealDate = Date;
const TM_ON = /[?&](draft|demo)(=|&|$)/.test(location.search);
const TM_OFFSET = TM_ON ? (+sessionStorage.getItem("tmOffset") || 0) : 0;
if (TM_OFFSET) {
  window.Date = class extends RealDate {
    constructor(...a) { a.length ? super(...a) : super(RealDate.now() + TM_OFFSET); }
    static now() { return RealDate.now() + TM_OFFSET; }
  };
}

/* Размер шрифта применяем сразу, до отрисовки, чтобы экран не «прыгал» */
try { const fs = JSON.parse(localStorage.getItem("fontSize")); if (fs === "1" || fs === "2") document.documentElement.dataset.fs = fs; } catch {}

/* Журнал ошибок для диагностики (собираем с самого начала) */
const DIAG_ERRORS = [];
window.addEventListener("error", e => DIAG_ERRORS.push((e.message || "error") + " @" + (e.lineno || "?")));
window.addEventListener("unhandledrejection", e => DIAG_ERRORS.push("promise: " + (e.reason && e.reason.message || e.reason)));

/* Офлайн-режим: регистрируем Service Worker сразу, ещё до загрузки данных,
   чтобы офлайн работал, даже если trip.json почему-то не загрузится. */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

/* ЗАГРУЗЧИК. Данные тура живут в trip.json, движок — в app.js.
   Порядок важен: сначала данные, потом движок (он сразу рисует экран из TOUR). */
/* ПЕРЕВОДЫ. Все надписи интерфейса живут в словаре i18n/<язык>.json.
   tx("k12") → текст фразы; tx("k14", город, км) → подставит {0} и {1}.
   Если ключа нет в словаре — покажем сам ключ: так пропуск сразу виден на экране. */
let I18N = {};
function tx(key, ...args) {   // не «t»: в app.js много локальных переменных t
  const s = I18N[key];
  if (s == null) { DIAG_ERRORS.push("i18n: нет ключа " + key); return key; }
  return args.length ? s.replace(/\{(\d+)\}/g, (m, i) => args[i]) : s;
}
// Надписи в самой разметке: data-i18n — текст, data-i18n-aria — подпись для экранного диктора
function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const nodes = [...el.childNodes].filter(n => n.nodeType === 3 && n.nodeValue.trim());
    const last = nodes[nodes.length - 1];      // текст после значка, если он есть
    if (last) last.nodeValue = last.nodeValue.replace(last.nodeValue.trim(), tx(el.dataset.i18n));
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", tx(el.dataset.i18nAria)));
}

const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(url + ": HTTP " + r.status); return r.json(); });
// ?draft — предпросмотр из конструктора: данные берём из памяти браузера, а не из trip.json
const DRAFT = new URLSearchParams(location.search).has("draft");
let NO_DRAFT = false;   // ?draft открыли на устройстве, где конструктора не было (например, ссылку переслали на телефон)
const loadTrip = () => {
  if (DRAFT) { try { const d = JSON.parse(localStorage.getItem("tripDraft")); if (d) return Promise.resolve(d); } catch {} NO_DRAFT = true; }
  return getJSON("trip.json");
};
loadTrip()
  // Язык интерфейса задаёт тур: «один выезд — один язык»
  .then(data => getJSON("i18n/" + (data.locale || "ru") + ".json").then(dict => [data, dict]))
  .then(([data, dict]) => {
    I18N = dict;
    document.documentElement.lang = data.locale || "ru";
    applyI18n();
    window.TOUR = data;
    // Шапка и заголовок вкладки — тоже из данных тура
    document.title = data.title + " — карманный гид";
    document.getElementById("hdr-title").textContent = data.title;
    document.getElementById("hdr-eyebrow").textContent = data.eyebrow || "";
    if (TM_ON) timeMachine(data);
    if (NO_DRAFT) {   // не молчим: иначе кажется, что показан черновик, а это тур сайта
      const n = document.createElement("div"); n.className = "nodraft"; n.textContent = tx("noDraft");
      document.body.prepend(n);
    }
    const s = document.createElement("script");
    s.src = "app.js";
    document.body.appendChild(s);
  })
  .catch(err => {
    DIAG_ERRORS.push("загрузка: " + err.message);
    const box = document.getElementById("v-today");
    box.classList.add("active");
    box.innerHTML =
      '<article class="card"><h2>Не удалось загрузить данные тура</h2>' +
      '<p>Проверьте интернет и откройте приложение ещё раз. После первого открытия оно работает и без сети.</p></article>';
  });

/* Полоска машины времени: ключевые моменты поездки одной кнопкой */
function timeMachine(T) {
  // Местное время date+hm в поясе tz → момент (мс)
  const zoned = (date, hm, tz) => {
    const guess = RealDate.parse(`${date}T${hm}:00Z`);
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      .formatToParts(new RealDate(guess)).map(x => [x.type, x.value]));
    return guess - (RealDate.parse(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:00Z`) - guess);
  };
  const addDays = (iso, n) => new RealDate(RealDate.parse(iso + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
  const home = (T.home && T.home.tz) || T.tz, out = T.flights && T.flights.out;
  // День вылета: за 4 часа до вылета (уже видно сбор в аэропорту и статус рейса); нет времени — полдень
  const depMs = out && out.at ? RealDate.parse(out.at) - 4 * 3600e3 : zoned(T.start, "12:00", home);
  const moments = [["week", tx("tmWeek"), zoned(addDays(T.start, -7), "10:00", home)], ["dep", tx("tmDep"), depMs]];
  const days = (T.days || []).map((d, i) => [`d${i + 1}`, tx("tmDay", i + 1), zoned(d.date, "09:00", T.tz)]);
  const last = (T.days || []).length ? [["last", tx("tmLast"), zoned(T.end || T.days[T.days.length - 1].date, "08:00", T.tz)]] : [];
  const cur = sessionStorage.getItem("tmKey") || "";
  const btn = ([k, label]) => `<button type="button" data-tm="${k}"${k === cur ? ' aria-pressed="true"' : ""}>${label}</button>`;
  const bar = document.createElement("div");
  bar.className = "tm-bar";
  bar.innerHTML = `<span class="tm-t">${tx("tmTitle")}</span>
    ${[...moments, ...last].map(btn).join("")}
    <select aria-label="${tx("tmPick")}"><option value="">${tx("tmPick")}</option>${days.map(([k, l]) => `<option value="${k}"${k === cur ? " selected" : ""}>${l}</option>`).join("")}</select>
    <button type="button" data-tm=""${cur ? "" : ' aria-pressed="true"'}>${tx("tmNow")}</button>`;
  document.body.prepend(bar);
  // На узком экране полоска прокручивается — показываем выбранный момент
  // («сейчас» — по умолчанию, тогда полоску не двигаем, чтобы было видно начало «🕰 Как будет:»)
  const on = cur && (bar.querySelector('[aria-pressed="true"]') || (cur.startsWith("d") && bar.querySelector("select")));
  if (on && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = on.offsetLeft - 80;
  const all = Object.fromEntries([...moments, ...days, ...last].map(([k, , ms]) => [k, ms]));
  const go = k => {
    if (k && all[k]) { sessionStorage.setItem("tmOffset", String(all[k] - RealDate.now())); sessionStorage.setItem("tmKey", k); }
    else { sessionStorage.removeItem("tmOffset"); sessionStorage.removeItem("tmKey"); }
    location.hash = "#today"; location.reload();
  };
  bar.addEventListener("click", e => { const b = e.target.closest("[data-tm]"); if (b) go(b.dataset.tm); });
  bar.querySelector("select").addEventListener("change", e => go(e.target.value));
}
</script>
</body>
</html>
